<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Study Buddy</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
      background: linear-gradient(135deg, #e9e7ff, #f8f5ff);
      color: #25233a;
      font-family: Arial, sans-serif;
    }

    .card {
      width: min(100%, 520px);
      padding: 30px;
      border-radius: 22px;
      background: white;
      box-shadow: 0 16px 45px #342a6d20;
    }

    .tag {
      color: #6958d6;
      font-size: 13px;
      font-weight: bold;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    h1 {
      margin: 10px 0;
      font-size: 34px;
    }

    .intro {
      margin: 0 0 24px;
      color: #77758a;
      line-height: 1.5;
    }

    form {
      display: flex;
      gap: 9px;
      margin-bottom: 20px;
    }

    input {
      min-width: 0;
      flex: 1;
      padding: 13px;
      border: 1px solid #dedbea;
      border-radius: 11px;
      font-size: 15px;
    }

    button {
      border: 0;
      border-radius: 11px;
      cursor: pointer;
      font-size: 14px;
      font-weight: bold;
    }

    .add-button {
      padding: 0 17px;
      background: #6958d6;
      color: white;
    }

    .add-button:hover {
      background: #5242bd;
    }

    .summary {
      margin: 0 0 12px;
      color: #77758a;
      font-size: 14px;
    }

    ul {
      display: grid;
      gap: 10px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    li {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 13px;
      border: 1px solid #eeeaf7;
      border-radius: 12px;
    }

    li input {
      width: 18px;
      height: 18px;
      accent-color: #6958d6;
    }

    li span {
      flex: 1;
    }

    li.done span {
      color: #9996a8;
      text-decoration: line-through;
    }

    .delete-button {
      padding: 7px 9px;
      background: #f5f3fb;
      color: #68647c;
    }

    .delete-button:hover {
      background: #ffe9ec;
      color: #c43f54;
    }

    .empty {
      padding: 22px;
      border-radius: 12px;
      background: #f8f7fc;
      color: #77758a;
      text-align: center;
    }
  </style>
</head>

<body>
  <main class="card">
    <div class="tag">My student project</div>
    <h1>Study Buddy</h1>
    <p class="intro">Add a study goal, then check it off when you finish.</p>

    <form id="goal-form">
      <input
        id="goal-input"
        type="text"
        placeholder="Type a study goal..."
        aria-label="Study goal"
        required
      >
      <button class="add-button" type="submit">Add goal</button>
    </form>

    <p class="summary" id="summary">0 goals completed</p>
    <ul id="goal-list"></ul>
  </main>

  <script>
    let goals = [
      { text: "Practice Python", done: false },
      { text: "Review C++ notes", done: false }
    ];

    const form = document.getElementById("goal-form");
    const input = document.getElementById("goal-input");
    const list = document.getElementById("goal-list");
    const summary = document.getElementById("summary");

    function showGoals() {
      list.replaceChildren();

      if (goals.length === 0) {
        const message = document.createElement("li");
        message.className = "empty";
        message.textContent = "No goals yet. Add one above!";
        list.appendChild(message);
      }

      goals.forEach((goal, index) => {
        const item = document.createElement("li");
        if (goal.done) item.classList.add("done");

        const checkbox = document.createElement("input");
        checkbox.type = "checkbox";
        checkbox.checked = goal.done;
        checkbox.setAttribute("aria-label", "Mark goal as complete");

        checkbox.addEventListener("change", () => {
          goals[index].done = checkbox.checked;
          showGoals();
        });

        const text = document.createElement("span");
        text.textContent = goal.text;

        const deleteButton = document.createElement("button");
        deleteButton.className = "delete-button";
        deleteButton.type = "button";
        deleteButton.textContent = "Delete";

        deleteButton.addEventListener("click", () => {
          goals.splice(index, 1);
          showGoals();
        });

        item.append(checkbox, text, deleteButton);
        list.appendChild(item);
      });

      const completed = goals.filter(goal => goal.done).length;
      summary.textContent = `${completed} of ${goals.length} goals completed`;
    }

    form.addEventListener("submit", event => {
      event.preventDefault();

      const goalText = input.value.trim();
      if (goalText === "") return;

      goals.push({ text: goalText, done: false });
      input.value = "";
      showGoals();
    });

    showGoals();
  </script>
</body>
</html>, initial-scale=1.0">
